<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Impulsa web pro</title>
</head>
<body>
    <div id="root">
        <aside class="sidebar">
          <section class="sidebar-header">
              <div class="header-project">
                  <span class="icon">📄</span>
                  <div class="project-info">
                      <span class="project-title">Project Name</span>
                  </div>
              </div>
              <span class="icon">☰</span>
          </section>
          
          <section class="sidebar-nav">
              <button class="nav-button active">Archivos</button>
              <button class="nav-button">Componentes</button>
              <span class="search-icon">🔍</span>
          </section>

          <section class="sidebar-pages">
              <div class="pages-header">
                  <h3>Pages</h3>
                  <span class="add-page">+</span>
              </div>
              <div class="page-item active">
                  <p>Page 1</p>
              </div>
              <div class="page-limit-info">
                  <p>2 free pages left.</p>
                  <a href="#">See plans that offer more</a>
              </div>
          </section>

          <section class="custom-html">
            <div>
              <input
                type="text"
                placeholder="Add tag HTML"
                id="input-node"
              />
              <button type="button" id="add-node">Add</button>
            </div>
              <div>
                Añadiendo hijo a: <span id="selected-path">mainRoot</span>
              </div>
          </section>

          <section class="sidebar-treeview">
              <div class="treeview-header">
                  <h3>Tree View</h3>
                  <span class="treeview-icon">☰</span>
              </div>
                <div class="treeview-group">  
                    <div class="treeview-details-content">
                        <details class="treeview-details" open>
                            <summary class="treeview-item" data-item="root">
                                <span class="treeview-name">Main-Root</span>
                                <div>
                                    <span>Del</span>
                                </div>
                            </summary>
                            <div class="treeview-root"></div>
                        </details>
                        
                    </div>
                </div>
          </section>
        </aside>
        <main>
            <div id="main-root">

            </div>
        </main>
        <div id="toolset-root">
            <div>
                <button class="nav-button active" id="btn-save">Guardar</button>
                <button class="nav-button active" id="btn-new">Nuevo</button>
            </div>
            <div class="tool">
                <button class="nav-button active">Diseño</button>
                <button class="nav-button">Interacción</button>
            </div>
            <div class="tool">
                <div>
                    <span>Position</span>
                    <select name="position" id="position">
                        <button>
                            <selectedcontent></selectedcontent>
                        </button>
                        <option value="absolute">Absolute</option>
                        <option value="fixed">Fixed</option>
                        <option value="relative">Relative</option>
                        <option value="static">Static</option>
                        <option value="sticky">Sticky</option>
                        <option value="inherit">Inherit</option>
                        <option value="initial">Initial</option>
                        <option value="revert">Revert</option>
                        <option value="revert-layer">revert-layer</option>
                        <option value="unset">Unset</option>
                    </select>
                </div>
            </div>
            <div class="tool">
                <span>Position</span>
            </div>
            <div class="tool">
                <div class="toolHeader">
                    
                    <span>Estilos CSS</span>
                    
                    <div>
                        <input type="text" id="atributo" placeholder="Ej: color">
                        <input type="text" id="atributo-value" placeholder="Ej: #000">
                        <button id="btn-add-style">Agregar estilos</button>
                    </div>
                </div>
                <div id="styles">

                </div>
            </div>
        </div>
    </div>
    <script src="helpers/uuid.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
